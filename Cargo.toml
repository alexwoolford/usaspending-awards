[package]
name = "usaspending-awards"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "USAspending prime-award transactions for UEIs on the exact CIK map"
license = "MIT"
repository = "https://github.com/alexwoolford/usaspending-awards"

[[bin]]
name = "usaspending-awards"
path = "src/main.rs"

[lib]
name = "usaspending_awards"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
capturable-state = { git = "https://github.com/alexwoolford/capturable-state", tag = "v0.1.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
